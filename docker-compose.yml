version: '3.8'

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: subscription_tracker
      MYSQL_USER: subtracker_user
      MYSQL_PASSWORD: subtrackerpass
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/subscription_tracker
      SPRING_DATASOURCE_USERNAME: subtracker_user
      SPRING_DATASOURCE_PASSWORD: subtrackerpass

  frontend:
    build: ../../SubscriptionTrackerAngular/subtrap-frontend
    ports:
      - "4200:80"
    depends_on:
      - backend

volumes:
  mysql_data: